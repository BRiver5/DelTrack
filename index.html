<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#C8102E">
<title>Sinterklaas Express</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🐴%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --red:#C8102E; --red2:#9E0B24; --gold:#F4B63D; --gold2:#FFE3A0; --cream:#FFF6E6; --paper:#fff;
  --ink:#2A2230; --muted:#6A6272; --green:#17803D; --greenbg:#E2F5E9; --line:#EDE4D3;
  --shadow:0 6px 22px rgba(80,40,20,.10); --r:22px;
  --display:'Fredoka','Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--body);color:var(--ink);background:radial-gradient(1200px 500px at 50% -10%,#fff 0,var(--cream) 60%,#F8E9CF 100%) fixed;line-height:1.4;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
h1,h2,h3{font-family:var(--display);margin:0;font-weight:600}
.app{max-width:480px;margin:0 auto;padding:0 14px calc(40px + env(safe-area-inset-bottom));position:relative;z-index:2}
#snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:90}

/* header */
.top{background:linear-gradient(160deg,var(--red),var(--red2));color:#fff;margin:0 -14px 12px;padding:calc(10px + env(safe-area-inset-top)) 16px 14px;border-radius:0 0 26px 26px;box-shadow:0 8px 24px rgba(158,11,36,.28)}
@media(min-width:500px){.top{margin:0 0 12px;border-radius:0 0 26px 26px}}
.top-row{display:flex;align-items:center;gap:10px}
.logo{width:48px;height:48px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.2);user-select:none;-webkit-user-select:none;touch-action:manipulation}
.logo svg{width:40px;height:40px}
.top h1{font-size:clamp(19px,5.6vw,24px);flex:1;line-height:1.05;letter-spacing:.2px;white-space:nowrap}
.top>.eta{margin-top:12px}
.lang{display:flex;background:rgba(0,0,0,.22);border-radius:999px;padding:3px}
.lang button{min-width:40px;height:40px;border-radius:999px;font-weight:800;font-size:13px;color:#fff;opacity:.85}
.lang button[aria-pressed=true]{background:#fff;color:var(--red);opacity:1}
.eta-row{display:flex;gap:10px;margin-top:12px;align-items:stretch}
.eta{flex:1;background:var(--greenbg);color:var(--green);border-radius:16px;padding:11px 14px;font-weight:800;font-size:15.5px;display:flex;align-items:center;min-height:48px;box-shadow:inset 0 0 0 2px rgba(23,128,61,.18)}
.eta.gold{background:#FFF0C7;color:#8A5A00;box-shadow:inset 0 0 0 2px rgba(244,182,61,.5)}
.eta.near{background:#FFE5E8;color:var(--red);animation:pulseBg 1.4s ease-in-out infinite}
.icon-btn{width:48px;height:48px;border-radius:16px;background:rgba(255,255,255,.2);display:grid;place-items:center;color:#fff;flex:none}
.icon-btn svg{width:24px;height:24px}
.icon-btn.spin svg{animation:spin .8s ease-in-out}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulseBg{50%{filter:brightness(1.07)}}

/* map */
.mapslot{position:relative;height:clamp(340px,54vh,500px);margin-bottom:14px}
.mapwrap{position:absolute;inset:0;border-radius:24px;overflow:hidden;box-shadow:var(--shadow);background:#e8edf3;isolation:isolate}
.mapslot.full .mapwrap{position:fixed;inset:0;border-radius:0;z-index:70}
#map{position:absolute;inset:0;background:#e6edf5}
.leaflet-tile-pane{filter:saturate(.45) brightness(1.06) contrast(.92) hue-rotate(-8deg)}
.night .leaflet-tile-pane{filter:none}
.night.invert-dark .leaflet-tile-pane{filter:invert(1) hue-rotate(185deg) saturate(.5) brightness(.85) contrast(.9)}
.night #map{background:#1d2330}
.leaflet-container{font-family:var(--body)}
.leaflet-control-attribution{font-size:9px!important;background:rgba(255,255,255,.6)!important}
.mbtn{position:absolute;z-index:500;width:48px;height:48px;border-radius:50%;background:#fff;box-shadow:0 3px 12px rgba(0,0,0,.22);display:grid;place-items:center;font-size:22px;color:var(--ink)}
.mbtn svg{width:24px;height:24px}
.mbtn:active{transform:scale(.94)}
#bExpand{top:12px;right:12px}
#bNight{top:12px;left:12px}
#bSound{top:68px;left:12px}
#bLocate{bottom:34px;right:12px}
#bFit{bottom:90px;right:12px}
.kmpill{position:absolute;z-index:500;left:50%;transform:translateX(-50%);bottom:34px;background:#fff;border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px;box-shadow:0 3px 12px rgba(0,0,0,.2);white-space:nowrap;max-width:60%}
.kmpill:empty{display:none}
.mapnote{position:absolute;z-index:450;left:72px;right:72px;top:50%;transform:translateY(-50%);background:#fff;border-radius:18px;padding:14px 16px;font-weight:800;font-size:14.5px;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.night.invert-dark .mapnote{filter:none}
.exp-collapse{display:none}.full .exp-collapse{display:block}.full .exp-expand{display:none}

/* map markers */
.pin{position:relative;width:42px;height:42px;border-radius:50%;background:#fff;border:3px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.35);display:grid;place-items:center;transform:translate(-21px,-48px)}
.pin::after{content:"";position:absolute;bottom:-9px;left:50%;margin-left:-6px;border:6px solid transparent;border-top:9px solid #fff;border-bottom:0}
.pin.dark{background:#1b1b22;border-color:#1b1b22}
.pin.dark::after{border-top-color:#1b1b22}
.pin svg{width:24px;height:24px}
.wp{position:relative;width:0;height:0}
.wp .dot{position:absolute;left:-6px;top:-6px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--ink)}
.wp.passed .dot{display:none}
.wp .star{position:absolute;left:-11px;top:-12px;font-size:20px;display:none;filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
.wp.passed .star{display:block}
.wp .lbl{position:absolute;top:-10px;left:12px;white-space:nowrap;font-weight:800;font-size:11.5px;color:var(--ink);text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 4px #fff}
.wp.l .lbl{left:auto;right:12px}
.night .wp .lbl{color:#fff;text-shadow:0 0 3px #000,0 0 4px #000}
.night .wp .dot{background:#222;border-color:#fff}
.sm{position:relative;width:96px;height:84px;margin:-62px 0 0 -48px;cursor:pointer}
.sm-orient{position:absolute;inset:0;transition:transform .6s ease}
.sm-bob{width:100%;height:100%;animation:bob 1.1s ease-in-out infinite}
.sm.resting .sm-bob{animation:bobslow 3.4s ease-in-out infinite}
.sm svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 3px 3px rgba(0,0,0,.3))}
.sm-zz{position:absolute;right:-2px;top:-12px;font-size:20px;display:none;font-weight:800}
.sm.resting .sm-zz{display:block;animation:zz 2.4s ease-in-out infinite}
.sm-pulse{position:absolute;left:50%;top:60%;width:20px;height:20px;margin:-10px;border-radius:50%;background:rgba(200,16,46,.35);display:none}
.sm.nearby .sm-pulse{display:block;animation:ring 1.4s ease-out infinite}
@keyframes ring{to{transform:scale(6);opacity:0}}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes bobslow{50%{transform:translateY(-1px)}}
@keyframes zz{0%{transform:translate(0,6px) scale(.7);opacity:0}30%{opacity:1}100%{transform:translate(8px,-14px) scale(1.2);opacity:0}}
.horse .leg{transform-box:fill-box;transform-origin:50% 8%;animation:gallop .55s ease-in-out infinite alternate}
.horse .leg.b{animation-delay:-.275s}
.resting .horse .leg,.horse.still .leg,.sm.still .horse .leg,.sm.still .horse .gifts{animation:none}
.sm.nogifts .gifts{display:none}
.horse .h-body{transform-box:fill-box;transform-origin:50% 50%;animation:breathe 3.2s ease-in-out infinite}
.horse .gifts{animation:giftbounce .55s ease-in-out infinite alternate}
.resting .horse .gifts{animation:none}
.horse .h-tail{transform-box:fill-box;transform-origin:90% 20%;animation:tail 1.6s ease-in-out infinite alternate}
.horse .h-head{transform-box:fill-box;transform-origin:15% 90%}
.horse.eating .h-head{animation:munch .28s ease-in-out 4 alternate}
@keyframes gallop{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}
@keyframes breathe{50%{transform:scale(1.015,1.04)}}
@keyframes giftbounce{from{transform:translateY(0)}to{transform:translateY(-2px)}}
@keyframes tail{from{transform:rotate(-6deg)}to{transform:rotate(7deg)}}
@keyframes munch{from{transform:rotate(0)}to{transform:rotate(16deg)}}
.lm{width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.3);display:grid;place-items:center;font-size:24px;animation:bob 1.3s ease-in-out infinite}
.spark{width:0;height:0;position:relative}
.spark i{position:absolute;left:-6px;top:-8px;font-style:normal;font-size:13px;color:#fff;text-shadow:0 0 4px #F4B63D,0 0 6px #F4B63D;animation:tw 1.4s ease-in-out infinite alternate}
@keyframes tw{from{transform:scale(.6) rotate(0)}to{transform:scale(1.15) rotate(40deg)}}

/* cards */
.card{background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:14px;position:relative}
.card h2{font-size:21px;line-height:1.15}
.card h3{font-size:17px}
.who{display:flex;gap:12px;align-items:center}
.avatar{width:62px;height:62px;border-radius:50%;background:#FFE9C7;overflow:hidden;flex:none;box-shadow:0 0 0 3px #fff,0 0 0 5px var(--gold)}
.avatar svg{width:100%;height:100%}
.who .meta{flex:1;min-width:0}
.who .rating{font-weight:800;color:var(--muted);font-size:13.5px;margin-top:3px}
.who .rating b{color:#E29A00}
.round-btn{width:52px;height:52px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:var(--green);flex:none;background:#fff}
.round-btn svg{width:26px;height:26px}
.bubble{position:relative;background:var(--greenbg);color:var(--green);font-weight:800;border-radius:16px;padding:13px 15px;margin:16px 0 12px;font-size:15.5px}
.bubble::before{content:"";position:absolute;top:-8px;left:26px;border:9px solid transparent;border-bottom-color:var(--greenbg);border-top:0}
.msg-btn{width:100%;min-height:52px;border:2px solid var(--line);border-radius:16px;display:flex;align-items:center;gap:10px;padding:0 14px;font-weight:800;color:var(--red);background:#fff}
.msg-btn svg{width:22px;height:22px}
.msg-btn .chev{margin-left:auto;color:var(--muted)}
.sleeps{display:flex;gap:16px;align-items:center;background:linear-gradient(135deg,#FFF1C9,#FFE08A);}
.sleeps-num{font-family:var(--display);font-weight:700;font-size:64px;line-height:1;color:var(--red);min-width:78px;text-align:center;text-shadow:0 3px 0 rgba(255,255,255,.7)}
.sleeps .lab{font-family:var(--display);font-size:22px;font-weight:600;line-height:1.1}
.sleeps .sub{font-size:13.5px;font-weight:700;color:#7a5a12;margin-top:4px}
.daily{display:flex;gap:12px;align-items:flex-start}
.daily .env{font-size:34px;line-height:1}
.daily .txt{font-weight:700;font-size:15.5px}
.daily .when{font-size:12.5px;color:var(--muted);font-weight:700;margin-bottom:2px}
.hero{text-align:center;background:linear-gradient(160deg,#FFF3D1,#FFD98A);padding:22px 16px}
.hero h2{font-size:26px;color:var(--red)}
.hero p{font-weight:800;margin:8px 0 12px}
.big-btn{min-height:52px;padding:0 22px;border-radius:999px;background:var(--red);color:#fff;font-weight:800;font-size:16px;box-shadow:0 4px 0 var(--red2)}
.big-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--red2)}
[hidden]{display:none!important}

/* stepper */
.stepper{position:relative;display:flex;justify-content:space-between;padding-top:2px}
.stepper .track{position:absolute;left:34px;right:34px;top:25px;height:6px;border-radius:6px;background:#EDE7DC}
.stepper .fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--ink);width:0;transition:width .8s ease}
.step{position:relative;width:68px;text-align:center}
.step .ic{width:52px;height:52px;margin:0 auto;border-radius:50%;background:#EDE7DC;display:grid;place-items:center;font-size:24px;filter:grayscale(1);opacity:.7;transition:.4s}
.step.done .ic,.step.active .ic{background:var(--ink);filter:none;opacity:1}
.step.active .ic{background:var(--red);animation:pulseS 1.5s ease-in-out infinite}
@keyframes pulseS{0%{box-shadow:0 0 0 0 rgba(200,16,46,.5)}100%{box-shadow:0 0 0 14px rgba(200,16,46,0)}}
.step .nm{font-size:11.5px;font-weight:800;margin-top:6px;line-height:1.1;color:var(--muted)}
.step.active .nm,.step.done .nm{color:var(--ink)}

/* order */
.order-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;gap:8px}
.order-no{font-size:12.5px;font-weight:800;color:var(--muted)}
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px dashed var(--line)}
.item .em{width:52px;height:52px;border-radius:16px;background:var(--cream);display:grid;place-items:center;font-size:30px;flex:none}
.item .nm{font-weight:800;line-height:1.2}
.item .for{font-size:13px;color:var(--muted);font-weight:700}
.chip{margin-left:auto;font-size:12px;font-weight:800;padding:6px 10px;border-radius:999px;background:#F1ECE2;color:var(--muted);text-align:center;flex:none;max-width:42%}
.chip.packed{background:#FFF0C7;color:#8A5A00}.chip.horse{background:#FFE5E8;color:var(--red)}.chip.done{background:var(--greenbg);color:var(--green)}

/* thank */
.thank{overflow:hidden}
.thank .row{display:flex;justify-content:space-between;align-items:flex-end;gap:6px}
.thank .lead{font-size:14px;color:var(--muted);font-weight:700;margin-top:6px}
.thank .ill{display:flex;align-items:flex-end;flex:none;width:170px;height:96px;position:relative}
.thank .ill .horse-s{width:112px;height:96px}
.thank .ill .piet-s{width:52px;height:96px;margin-left:-6px}
.thank .ill svg{width:100%;height:100%;overflow:visible}
.piet .wave{transform-origin:50px 60px;animation:wave .7s ease-in-out infinite alternate}
@keyframes wave{from{transform:rotate(-14deg)}to{transform:rotate(16deg)}}
.treats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.treat{min-height:56px;border:2px solid var(--line);border-radius:16px;background:#fff;font-weight:800;font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:4px;padding:0 4px;transition:.15s}
.treat .e{font-size:22px}
.treat:active{transform:scale(.93);background:var(--cream)}
.ate{margin-top:12px;font-weight:800;font-size:14.5px}
.ate small{display:block;color:var(--muted);font-weight:700;margin-top:2px}
.sintsay{margin-top:10px;background:var(--cream);border-radius:14px;padding:9px 12px;font-weight:800;color:var(--red);min-height:40px;font-size:15px}
.fly{position:absolute;font-size:28px;pointer-events:none;z-index:5;animation:fly .9s ease-in forwards}
@keyframes fly{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.5);opacity:0}}

/* carousel */
.car{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -14px 8px;padding:2px 14px 12px;scrollbar-width:none}
.car::-webkit-scrollbar{display:none}
.slide{flex:0 0 84%;scroll-snap-align:center;background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;min-height:200px;display:flex;flex-direction:column;gap:8px}
.slide .tag{font-size:12px;font-weight:800;color:var(--red);text-transform:uppercase;letter-spacing:.6px}
.slide .big{font-size:17px;font-weight:700;line-height:1.35}
.slide .em{font-size:42px;line-height:1}
.slide .sp{flex:1}
.mini-btn{align-self:flex-start;min-height:48px;padding:0 18px;border-radius:999px;background:var(--cream);font-weight:800;border:2px solid var(--gold)}
.mini-btn.on{background:var(--greenbg);border-color:var(--green);color:var(--green)}
.dots{display:flex;gap:7px;justify-content:center;margin:-2px 0 16px}
.dots i{width:8px;height:8px;border-radius:50%;background:#D9D0BF;transition:.3s}
.dots i.on{background:var(--red);width:22px;border-radius:6px}

/* stickers */
.stk-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.stk{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:16px;min-height:76px;position:relative}
.stk .ico{width:44px;height:44px;font-size:34px;display:grid;place-items:center;line-height:1}
.stk .ico svg{width:44px;height:44px}
.stk .n{font-size:11.5px;font-weight:800;text-align:center;line-height:1.05}
.stk.locked .ico{filter:grayscale(1) brightness(.32);opacity:.45}
.stk.locked .n{color:#aaa}
.stk.ready{background:#FFF3CD;animation:wig 1.2s ease-in-out infinite}
.stk.ready::after{content:"!";position:absolute;top:2px;right:8px;width:20px;height:20px;border-radius:50%;background:var(--red);color:#fff;font-weight:800;font-size:13px;display:grid;place-items:center}
.stk.got{background:#fff;box-shadow:inset 0 0 0 2px var(--gold2)}
.stk.pop .ico{animation:pop .6s ease}
@keyframes wig{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes pop{0%{transform:scale(.3) rotate(-30deg)}60%{transform:scale(1.3)}100%{transform:scale(1)}}
.blades{transform-box:fill-box;transform-origin:50% 50%;animation:spin 6s linear infinite}

.foot{text-align:center;color:var(--muted);font-weight:700;font-size:13.5px;margin:20px 0 6px}
.foot a{color:inherit}

/* sheets & toast */
.backdrop{position:fixed;inset:0;background:rgba(30,15,20,.5);z-index:80;opacity:0;pointer-events:none;transition:.25s}
.backdrop.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:#fff;border-radius:26px 26px 0 0;z-index:85;padding:16px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .3s ease;max-height:88vh;overflow:auto;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.sheet.open{transform:none}
.sheet .grab{width:44px;height:5px;background:#DDD3C2;border-radius:5px;margin:-4px auto 12px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.x-btn{width:48px;height:48px;border-radius:50%;background:var(--cream);font-size:20px;font-weight:800}
.chat{display:flex;flex-direction:column;gap:8px;max-height:34vh;overflow:auto;padding:4px 2px 8px}
.msg{max-width:84%;padding:10px 13px;border-radius:16px;font-weight:700;font-size:15px}
.msg.me{align-self:flex-end;background:var(--red);color:#fff;border-bottom-right-radius:4px}
.msg.sint{align-self:flex-start;background:var(--greenbg);color:#0f5e2c;border-bottom-left-radius:4px}
.msg.typing{letter-spacing:3px}
.presets{display:grid;gap:8px;margin-top:8px}
.preset{min-height:52px;border:2px solid var(--line);border-radius:16px;font-weight:800;text-align:left;padding:8px 14px;background:#fff}
.preset:active{background:var(--cream)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,160%);z-index:100;background:#2A2230;color:#fff;border-radius:18px;padding:10px 16px 10px 10px;max-width:min(92vw,440px);display:flex;gap:10px;align-items:center;font-weight:800;box-shadow:0 8px 30px rgba(0,0,0,.35);transition:transform .35s cubic-bezier(.2,1.3,.4,1)}
.toast.show{transform:translate(-50%,0)}
.toast .av{width:38px;height:38px;border-radius:50%;background:#FFE9C7;flex:none;overflow:hidden}
.toast .av svg{width:100%;height:100%}
.field{display:grid;gap:4px;margin:10px 0;font-weight:800;font-size:14px}
.field input[type=datetime-local],.field input[type=text],.field textarea{min-height:48px;border:2px solid var(--line);border-radius:12px;padding:8px 10px;font:inherit;font-weight:700;width:100%}
.field textarea{min-height:90px;resize:vertical}
.field input[type=range]{width:100%;height:36px;accent-color:var(--red)}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.sm-btn{min-height:48px;padding:0 16px;border-radius:14px;background:var(--cream);font-weight:800;border:2px solid var(--line)}
.sm-btn.red{background:var(--red);color:#fff;border-color:var(--red)}
.tabs{display:flex;gap:8px;margin-bottom:10px}
.tabs button{flex:1;min-height:48px;border-radius:14px;border:2px solid var(--line);font-weight:800}
.tabs button[aria-pressed=true]{background:var(--red);color:#fff;border-color:var(--red)}
#drawCv{width:100%;aspect-ratio:7/5;border:2px dashed var(--gold);border-radius:16px;background:#fffdf7;touch-action:none}
.simbadge{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom));left:10px;z-index:95;background:#2A2230;color:#fff;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:800;opacity:.9}
.gate{position:fixed;inset:0;z-index:999;background:linear-gradient(160deg,var(--red),var(--red2));display:grid;place-items:center;padding:20px;color:#fff;text-align:center}
.gate .box{max-width:380px;width:100%}
.gate .av{width:110px;height:110px;margin:0 auto 12px;border-radius:50%;background:#FFE9C7;overflow:hidden}
.gate input{width:100%;min-height:54px;border-radius:16px;border:0;padding:0 16px;font:inherit;font-weight:800;font-size:18px;margin:14px 0 10px;text-align:center}
.gate .err{min-height:22px;font-weight:800;color:var(--gold2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(min-width:700px){.app{padding-top:14px}.top{border-radius:26px;margin-top:0}}
@media(min-width:600px) and (max-width:959px){.app{max-width:600px}}
/* desktop: map left (sticky), cards right, slim one-line header */
@media(min-width:960px){
  .app{max-width:1240px;padding:18px 24px 40px;display:grid;grid-template-columns:minmax(0,1fr) 420px;column-gap:24px;align-items:start}
  .app>*{grid-column:2;min-width:0}
  .top{grid-column:1/-1;margin:0 0 20px;border-radius:24px;display:flex;align-items:center;gap:16px;padding:12px 16px}
  .top-row{display:contents}
  .top>.eta{order:2;flex:0 1 480px;margin-top:0}
  #refresh{order:3}
  .mapslot{grid-column:1;grid-row:2/span 30;align-self:start;position:sticky;top:18px;height:calc(100vh - 140px);min-height:520px;margin:0}
  .car{margin:0 0 8px;padding:2px 2px 12px}
  .slide{flex-basis:90%}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<canvas id="snow" aria-hidden="true"></canvas>
<canvas id="confetti" aria-hidden="true"></canvas>

<div class="gate" id="gate" hidden>
  <div class="box">
    <div class="av" id="gateAv"></div>
    <h2 id="gateQ" style="font-size:26px"></h2>
    <input id="gateIn" type="text" autocomplete="off" autocapitalize="none" aria-label="secret word">
    <div class="err" id="gateErr" role="alert"></div>
    <button class="big-btn" id="gateGo" style="background:#fff;color:var(--red);box-shadow:0 4px 0 rgba(0,0,0,.2)" data-i18n="gateGo"></button>
  </div>
</div>

<div class="simbadge" id="simBadge" hidden></div>

<main class="app">
  <header class="top">
    <div class="top-row">
      <button class="logo" id="logo" aria-label="Sinterklaas Express" type="button"></button>
      <h1>Sinterklaas Express</h1>
      <button class="icon-btn" id="refresh" data-i18n-aria="refresh" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg>
      </button>
    </div>
    <div class="eta" id="eta" role="status" aria-live="polite"><span id="etaText"></span></div>
  </header>

  <section class="mapslot" id="mapslot">
    <div class="mapwrap" id="mapwrap">
      <div id="map" role="application" data-i18n-aria="mapLabel"></div>
      <button class="mbtn" id="bExpand" type="button" data-i18n-aria="expand">
        <svg class="exp-expand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/></svg>
        <svg class="exp-collapse" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10h-6V4M4 14h6v6M14 10l7-7M10 14l-7 7"/></svg>
      </button>
      <button class="mbtn" id="bNight" type="button" data-i18n-aria="night" aria-pressed="false">🌙</button>
      <button class="mbtn" id="bSound" type="button" data-i18n-aria="sound" aria-pressed="true">🔔</button>
      <button class="mbtn" id="bFit" type="button" data-i18n-aria="fit">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
      <button class="mbtn" id="bLocate" type="button" data-i18n-aria="locate">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="8.5"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3"/></svg>
      </button>
      <div class="kmpill" id="kmPill"></div>
      <div class="mapnote" id="mapNote" role="alert" hidden></div>
    </div>
  </section>

  <section class="card hero" id="hero" hidden>
    <h2 id="heroT"></h2>
    <p id="heroS"></p>
    <button class="big-btn" id="heroBtn" type="button"></button>
  </section>

  <section class="card partner">
    <div class="who">
      <div class="avatar" id="avatar"></div>
      <div class="meta">
        <h2 data-i18n="partnerName"></h2>
        <div class="rating"><b>★ 5.0</b> · <span data-i18n="rating"></span></div>
      </div>
      <button class="round-btn" id="callBtn" type="button" data-i18n-aria="call">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/><path d="M15 3a6 6 0 0 1 6 6M15 6.5A2.5 2.5 0 0 1 17.5 9"/></svg>
      </button>
    </div>
    <div class="bubble" id="bubble" aria-live="polite"></div>
    <button class="msg-btn" id="msgBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="14" rx="4"/><path d="M8 22l3-4M8 9h8M8 13h5"/></svg>
      <span data-i18n="sendMsg"></span>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </button>
  </section>

  <section class="card sleeps" aria-live="polite">
    <div class="sleeps-num" id="sleepsNum">0</div>
    <div>
      <div class="lab" id="sleepsLab"></div>
      <div class="sub" id="sleepsSub"></div>
    </div>
  </section>

  <section class="card daily">
    <div class="env" id="dailyEnv">💌</div>
    <div>
      <h3 data-i18n="dailyT"></h3>
      <div class="when" id="dailyWhen"></div>
      <div class="txt" id="dailyTxt"></div>
    </div>
  </section>

  <section class="card" aria-label="progress">
    <div class="stepper" id="stepper">
      <div class="track"><div class="fill" id="stepFill"></div></div>
      <div class="step"><div class="ic">📋</div><div class="nm" data-i18n="step1"></div></div>
      <div class="step"><div class="ic">🎁</div><div class="nm" data-i18n="step2"></div></div>
      <div class="step"><div class="ic">🐴</div><div class="nm" data-i18n="step3"></div></div>
      <div class="step"><div class="ic">🏠</div><div class="nm" data-i18n="step4"></div></div>
    </div>
  </section>

  <section class="card">
    <div class="order-head"><h2 data-i18n="orderT"></h2><span class="order-no" id="orderNo"></span></div>
    <div id="items"></div>
    <div class="item" style="padding-bottom:0"><div class="em" style="font-size:24px">📍</div><div><div class="nm" data-i18n="deliverTo"></div><div class="for" id="addr"></div></div></div>
  </section>

  <section class="card thank" id="thank">
    <div class="row">
      <div>
        <h2 data-i18n="thankT"></h2>
        <div class="lead" data-i18n="thankLead"></div>
      </div>
      <div class="ill" aria-hidden="true"><div class="horse-s" id="thankHorse"></div><div class="piet-s" id="thankPiet"></div></div>
    </div>
    <div class="treats">
      <button class="treat" data-treat="carrot" type="button"><span class="e">🥕</span></button>
      <button class="treat" data-treat="hay" type="button"><span class="e">🌾</span></button>
      <button class="treat" data-treat="apple" type="button"><span class="e">🍎</span></button>
      <button class="treat" data-treat="other" type="button"><span data-i18n="other"></span></button>
    </div>
    <div class="ate" id="ate"></div>
    <div class="sintsay" id="sintSay" aria-live="polite"></div>
  </section>

  <div class="car" id="car" tabindex="0" aria-label="Sinterklaas">
    <article class="slide" id="sFact"></article>
    <article class="slide" id="sShoe"></article>
    <article class="slide" id="sQuest"></article>
    <article class="slide" id="sNext"></article>
  </div>
  <div class="dots" id="dots"><i class="on"></i><i></i><i></i><i></i></div>

  <section class="card">
    <div class="order-head" style="margin-bottom:0"><h2 data-i18n="stkT"></h2><span class="order-no" id="stkCount"></span></div>
    <div class="stk-row" id="stkRow"></div>
  </section>

</main>

<div class="backdrop" id="backdrop"></div>

<!-- chat sheet -->
<div class="sheet" id="chatSheet" role="dialog" aria-modal="true" aria-labelledby="chatT">
  <div class="grab"></div>
  <div class="sheet-head"><h2 id="chatT" data-i18n="chatT"></h2><button class="x-btn" data-close type="button" aria-label="Close">✕</button></div>
  <div class="chat" id="chat" aria-live="polite"></div>
  <div class="presets" id="presets"></div>
</div>

<!-- other thank-you sheet -->
<div class="sheet" id="otherSheet" role="dialog" aria-modal="true" aria-labelledby="otherT">
  <div class="grab"></div>
  <div class="sheet-head"><h2 id="otherT" data-i18n="otherT"></h2><button class="x-btn" data-close type="button" aria-label="Close">✕</button></div>
  <div class="tabs"><button type="button" data-tab="draw" aria-pressed="true" data-i18n="tabDraw"></button><button type="button" data-tab="note" aria-pressed="false" data-i18n="tabNote"></button></div>
  <div id="paneDraw">
    <canvas id="drawCv" width="560" height="400" aria-label="drawing"></canvas>
    <div class="row-btns" style="margin-top:10px"><button class="sm-btn" id="drawClear" type="button" data-i18n="clear"></button><button class="sm-btn red" id="drawSend" type="button" data-i18n="sendSint"></button></div>
  </div>
  <div id="paneNote" hidden>
    <div class="field"><textarea id="noteTxt" maxlength="200" data-i18n-ph="notePh"></textarea></div>
    <button class="sm-btn red" id="noteSend" type="button" data-i18n="sendSint"></button>
  </div>
</div>

<!-- parent sheet -->
<div class="sheet" id="parentSheet" role="dialog" aria-modal="true" aria-labelledby="parT">
  <div class="grab"></div>
  <div class="sheet-head"><h2 id="parT" data-i18n="parT"></h2><button class="x-btn" data-close type="button" aria-label="Close">✕</button></div>
  <div class="field"><label for="ptNow" data-i18n="parTime"></label><input type="datetime-local" id="ptNow" min="2026-11-19T00:00" max="2026-11-28T23:59"></div>
  <div class="field"><input type="range" id="ptSlider" min="0" max="1" step="1" aria-label="time travel"></div>
  <div class="row-btns"><button class="sm-btn" id="ptLive" type="button" data-i18n="parLive"></button></div>
  <div class="field"><label for="ptFinal" data-i18n="parFinal"></label><input type="datetime-local" id="ptFinal"></div>
  <div class="row-btns"><button class="sm-btn red" id="ptFinalSave" type="button" data-i18n="parSave"></button><button class="sm-btn" id="ptFinalDef" type="button" data-i18n="parDefault"></button></div>
  <div class="field" style="grid-auto-flow:column;justify-content:start;align-items:center;gap:10px"><input type="checkbox" id="ptSound" style="width:24px;height:24px"><label for="ptSound" data-i18n="parSound"></label></div>
  <div class="row-btns"><button class="sm-btn" id="ptReset" type="button" data-i18n="parReset"></button></div>
  <p style="font-size:12.5px;color:var(--muted);font-weight:700" data-i18n="parNote"></p>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"><div class="av" id="toastAv"></div><div id="toastTxt"></div></div>

    m.nearby = (T.final - tm) <= CONFIG.nearbyMinutes * 60000;
    m.f = 2 + m.d / totalKm;
  } else {
    m.phase = 'E'; m.f = 3; m.d = totalKm; m.next = stops.length - 1;
  }
  if (m.d !== undefined){
    m.pos = pointAtDist(m.d);
    // nearest city
    let best = 0, bd = 1e9;
    stopDist.forEach((sd, i) => { const dd = Math.abs(sd - m.d); if (dd < bd){ bd = dd; best = i; } });
    m.cityIdx = m.rest !== undefined ? m.rest : best;
    m.city = stops[m.cityIdx].id;
    m.km = Math.max(0, totalKm - m.d);
  } else {
    m.pos = null;
  }
  return m;
}

let AC = null, unlocked = false, soundOn = store.get('sound', true);
function unlock(){
  if (unlocked) return; unlocked = true;
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch(e){ AC = null; }
}
['pointerdown', 'touchstart', 'keydown'].forEach(ev => addEventListener(ev, unlock, { passive: true }));
function tone(freq, start, dur, type, vol){
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, AC.currentTime + start);
  g.gain.exponentialRampToValueAtTime(vol, AC.currentTime + start + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + start + dur);
  o.connect(g); g.connect(AC.destination); o.start(AC.currentTime + start); o.stop(AC.currentTime + start + dur + 0.05);
}
function noiseBurst(start, dur, freq, vol, q){
  const len = Math.floor(AC.sampleRate * dur), buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const s = AC.createBufferSource(); s.buffer = buf;
  const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q || 1;
  const g = AC.createGain(); g.gain.value = vol;
  s.connect(f); f.connect(g); g.connect(AC.destination); s.start(AC.currentTime + start);
}
const can = () => soundOn && AC;

  bell(){ if (!can()) return; [[880,.1],[2430,.04],[4750,.02]].forEach(([f,v]) => { tone(f, 0, 1.8, 'sine', v); tone(f, .55, 1.6, 'sine', v * .6); }); },
  hoof(n){ if (!can()) return; for (let i = 0; i < (n || 6); i++){ const base = i * 0.19; noiseBurst(base, .09, 260, .55, 2); noiseBurst(base + .09, .07, 340, .35, 2); } },
  munch(){ if (!can()) return; noiseBurst(0, .07, 900, .35, 3); noiseBurst(.13, .07, 700, .35, 3); },
  pop(){ if (!can()) return; tone(660, 0, .12, 'triangle', .12); tone(990, .08, .16, 'triangle', .1); },
  fanfare(){ if (!can()) return; [[523,0],[659,.16],[784,.32],[1047,.5],[784,.8],[1047,.95]].forEach(([f, s]) => tone(f, s, .35, 'triangle', .13)); }

let lastHeading = { rot: 0, flip: 1 };
function bearingFor(d){
  const a = pointAtDist(d - 4), b = pointAtDist(d + 4);
  const dx = (b.lng - a.lng) * Math.cos(b.lat * Math.PI / 180), dy = b.lat - a.lat;
  if (Math.abs(dx) < 1e-6 && Math.abs(dy) < 1e-6) return lastHeading;

  return lastHeading = { rot, flip };
}

  const c = $('#car'), kids = c.children; let best = 0, bd = 1e9;
  const mid = c.scrollLeft + c.clientWidth / 2;
  for (let i = 0; i < kids.length; i++){ const cc = kids[i].offsetLeft + kids[i].offsetWidth / 2; const dd = Math.abs(cc - mid); if (dd < bd){ bd = dd; best = i; } }
  $$('#dots i').forEach((d, i) => d.classList.toggle('on', i === best));
}, { passive: true });

/* ---- stickers ---- */
function renderStickers(m){
  const coll = store.get('stickers', {});
  const states = STICKERS.map((s, i) => m.t >= stickerTime(i) ? (coll[s.id] ? 'got' : 'ready') : 'locked');
  const unlockedN = states.filter(s => s !== 'locked').length;
  const sig = states.join(',') + lang;
  $('#stkCount').textContent = t('stkCount', { n: states.filter(s => s === 'got').length, m: STICKERS.length });
  if (prevUnlocked !== null && unlockedN > prevUnlocked){
    const i = states.findIndex((s, k) => s !== 'locked' && k === unlockedN - 1);
    sfx.pop(); say(t('stkGot', { s: raw('stk')[STICKERS[Math.max(0, i)].id] }));
  }
  prevUnlocked = unlockedN;
  if (sig === stkSig) return; stkSig = sig;
  $('#stkRow').innerHTML = STICKERS.map((s, i) => {
    const ico = s.ico === 'WINDMILL' ? windmillSVG() : s.ico;
    const name = raw('stk')[s.id];
    return `<button class="stk ${states[i]}" data-id="${s.id}" data-i="${i}" type="button" aria-label="${name}${states[i] === 'locked' ? ' (locked)' : ''}"><span class="ico">${ico}</span><span class="n">${name}</span></button>`;
  }).join('');
}
$('#stkRow').addEventListener('click', e => {
  const b = e.target.closest('.stk'); if (!b) return;
  const name = raw('stk')[b.dataset.id];
  if (b.classList.contains('locked')){ say(t('stkLocked')); return; }
  if (b.classList.contains('ready')){
    const coll = store.get('stickers', {}); coll[b.dataset.id] = true; store.set('stickers', coll);
    sfx.pop(); say(t('stkGot', { s: name })); stkSig = ''; renderStickers(lastModel);
    const nb = $(`.stk[data-id="${b.dataset.id}"]`); if (nb){ nb.classList.add('pop'); setTimeout(() => nb.classList.remove('pop'), 700); }
  }
});

/* =====================================================================
   confetti / snow
   ===================================================================== */
let confettiRunning = false;
function celebrate(user){
  if (user){ sfx.bell(); sfx.fanfare(); }
  else if (unlocked) sfx.fanfare();
  if (reduceMotion || confettiRunning) return;
  const cv = $('#confetti'), ctx = cv.getContext('2d');
  const W = cv.width = innerWidth, H = cv.height = innerHeight;
  const cols = ['#C8102E', '#F4B63D', '#17803D', '#fff', '#3A86FF', '#FF8FB1'];
  const ps = Array.from({ length: 160 }, () => ({ x: Math.random() * W, y: -20 - Math.random() * H * .6, w: 6 + Math.random() * 7, h: 8 + Math.random() * 8, c: cols[Math.floor(Math.random() * cols.length)], vy: 2 + Math.random() * 3.5, vx: -1.5 + Math.random() * 3, r: Math.random() * 6, vr: -.2 + Math.random() * .4 }));
  const end = performance.now() + 6500; confettiRunning = true;
  (function f(ts){
    ctx.clearRect(0, 0, W, H);
    ps.forEach(p => { p.x += p.vx + Math.sin(p.y / 40) * .8; p.y += p.vy; p.r += p.vr; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore(); });
    if (ts < end) requestAnimationFrame(f); else { ctx.clearRect(0, 0, W, H); confettiRunning = false; }
  })(performance.now());
}
(function snow(){
  if (reduceMotion) return;
  const cv = $('#snow'), ctx = cv.getContext('2d'); let W, H, flakes = [];
  function size(){ W = cv.width = innerWidth; H = cv.height = innerHeight; flakes = Array.from({ length: Math.round(Math.min(70, W / 8)) }, () => ({ x: Math.random() * W, y: Math.random() * H, r: .8 + Math.random() * 2.2, v: .25 + Math.random() * .8, ph: Math.random() * 6 })); }
  size(); addEventListener('resize', size);
  let last = 0;
  (function f(ts){
    requestAnimationFrame(f);
    if (document.hidden || ts - last < 33) return; last = ts;
    ctx.clearRect(0, 0, W, H); ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.strokeStyle = 'rgba(150,170,200,.35)';
    flakes.forEach(s => { s.y += s.v; s.ph += .02; s.x += Math.sin(s.ph) * .35; if (s.y > H + 4){ s.y = -4; s.x = Math.random() * W; } ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.283); ctx.fill(); ctx.stroke(); });
  })(0);
})();

/* =====================================================================
   language / static i18n
   ===================================================================== */
function applyLang(){
  document.documentElement.lang = lang;
  $$('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  $$('[data-i18n-aria]').forEach(el => el.setAttribute('aria-label', t(el.dataset.i18nAria)));
  $$('[data-i18n-ph]').forEach(el => el.placeholder = t(el.dataset.i18nPh));
  $$('.lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
  $('#gateQ').textContent = t('gateQ');
  buildPresets();
  if (chatStarted){ chatStarted = false; $('#chat').innerHTML = ''; }
  stkSig = '';
  if (lastModel) render();
}

/* =====================================================================
   sheets
   ===================================================================== */
let openSheetEl = null;
function openSheet(id){
  closeSheet(true); openSheetEl = $('#' + id); openSheetEl.classList.add('open'); $('#backdrop').classList.add('open');
}
function closeSheet(keep){
  if (openSheetEl){ openSheetEl.classList.remove('open'); openSheetEl = null; }
  if (!keep) $('#backdrop').classList.remove('open');
}
$('#backdrop').addEventListener('click', () => closeSheet());
$$('[data-close]').forEach(b => b.addEventListener('click', () => closeSheet()));
addEventListener('keydown', e => { if (e.key === 'Escape'){ if (openSheetEl) closeSheet(); else if (mapFullOn) toggleFull(false); } });

/* ---- chat ---- */
let chatStarted = false;
function buildPresets(){
  $('#presets').innerHTML = raw('q').map((q, i) => `<button class="preset" data-i="${i}" type="button">${q}</button>`).join('');
}
function addMsg(cls, text){ const d = document.createElement('div'); d.className = 'msg ' + cls; d.textContent = text; $('#chat').appendChild(d); $('#chat').scrollTop = 1e6; return d; }
$('#msgBtn').addEventListener('click', () => {
  if (!chatStarted){ chatStarted = true; addMsg('sint', t('chatHi')); }
  openSheet('chatSheet');
});
$('#presets').addEventListener('click', e => {
  const b = e.target.closest('.preset'); if (!b) return;
  const i = +b.dataset.i; addMsg('me', raw('q')[i]); sfx.pop();
  const typing = addMsg('sint typing', '• • •');
  setTimeout(() => {
    typing.remove();
    const R = raw('r'); let txt;
    if (i === 0){ const m = lastModel; txt = (m && m.km !== undefined && m.phase === 'C') ? R[0].replace('{km}', Math.max(1, Math.round(m.km / 10) * 10)) : R[1]; }
    else txt = R[i + 1];
    addMsg('sint', txt.replace(/\{name\}/g, CONFIG.recipient)); if (i === 2) sfx.hoof(3); else sfx.bell();
  }, 1000);
});
$('#callBtn').addEventListener('click', () => { sfx.bell(); sfx.hoof(4); say(t('callSay')); });

/* ---- other thank-you ---- */
const cv = $('#drawCv'), cx = cv.getContext('2d');
function resetDraw(){
  cx.clearRect(0, 0, cv.width, cv.height); cx.setLineDash([10, 10]); cx.strokeStyle = '#F4B63D'; cx.lineWidth = 4;
  const w = cv.width, h = cv.height, x = w / 2, y = h * .28, s = h * .52;
  cx.beginPath(); cx.moveTo(x, y + s * .85); cx.bezierCurveTo(x - s * 1.5, y + s * .1, x - s * .6, y - s * .55, x, y + s * .2); cx.bezierCurveTo(x + s * .6, y - s * .55, x + s * 1.5, y + s * .1, x, y + s * .85); cx.stroke(); cx.setLineDash([]);
  cx.strokeStyle = '#C8102E'; cx.lineWidth = 9; cx.lineCap = 'round'; cx.lineJoin = 'round';
}
resetDraw();
let drawing = false;
const pt = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * cv.width / r.width, (e.clientY - r.top) * cv.height / r.height]; };
cv.addEventListener('pointerdown', e => { drawing = true; cv.setPointerCapture(e.pointerId); const [x, y] = pt(e); cx.beginPath(); cx.moveTo(x, y); cx.lineTo(x + .1, y + .1); cx.stroke(); });
cv.addEventListener('pointermove', e => { if (!drawing) return; const [x, y] = pt(e); cx.lineTo(x, y); cx.stroke(); });
['pointerup', 'pointercancel'].forEach(ev => cv.addEventListener(ev, () => drawing = false));
$('#drawClear').addEventListener('click', resetDraw);
$$('.tabs button').forEach(b => b.addEventListener('click', () => {
  $$('.tabs button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  $('#paneDraw').hidden = b.dataset.tab !== 'draw'; $('#paneNote').hidden = b.dataset.tab !== 'note';
}));
$('#noteTxt').value = store.get('note', '');
$('#drawSend').addEventListener('click', () => { closeSheet(); feed('heart'); sintThanks(t('thxHeart')); sfx.bell(); });
$('#noteSend').addEventListener('click', () => { store.set('note', $('#noteTxt').value); closeSheet(); feed('heart'); sintThanks(t('thxNote')); sfx.bell(); });
$('#thank').addEventListener('click', e => {
  const b = e.target.closest('.treat'); if (!b) return;
  if (b.dataset.treat === 'other'){ openSheet('otherSheet'); return; }
  feed(b.dataset.treat, b);
});

/* =====================================================================
   parent mode
   ===================================================================== */
const [rangeA, rangeB] = CONFIG.timeTravelRange.map(parseAms);
const STEP = 15 * 60000, nSteps = Math.round((rangeB - rangeA) / STEP);
function syncParent(){
  const n = now(); $('#ptNow').value = toInput(n);
  const sl = $('#ptSlider'); sl.max = nSteps; sl.value = clamp(Math.round((n - rangeA) / STEP), 0, nSteps);
  $('#ptFinal').value = finalStr; $('#ptSound').checked = soundOn;
}
function openParent(){ syncParent(); openSheet('parentSheet'); }
function setSimTime(ms){ offset = ms - Date.now(); prevUnlocked = null; render(); }
$('#ptNow').addEventListener('change', e => { const v = parseAms(e.target.value); if (!isNaN(v)){ setSimTime(v); syncParent(); } });
$('#ptSlider').addEventListener('input', e => { setSimTime(rangeA + (+e.target.value) * STEP); $('#ptNow').value = toInput(now()); });
$('#ptLive').addEventListener('click', () => { offset = 0; prevUnlocked = null; render(); syncParent(); });
$('#ptSound').addEventListener('change', e => { soundOn = e.target.checked; store.set('sound', soundOn); setSoundUI(); });
$('#ptFinalSave').addEventListener('click', () => {
  const v = $('#ptFinal').value, ms = parseAms(v), prevDep = parseAms(CONFIG.waypoints[CONFIG.waypoints.length - 2].depart);
  if (isNaN(ms) || ms <= prevDep + 30 * 60000){ say(t('parBad')); return; }
  finalStr = v; store.set('final', v); buildTimeline(); render(); say(t('parSaved'));
});
$('#ptFinalDef').addEventListener('click', () => { finalStr = CONFIG.finalArrival; store.del('final'); buildTimeline(); render(); syncParent(); });
$('#ptReset').addEventListener('click', () => {
  store.del('stickers'); store.del('feed'); store.clearPrefix('shoe_'); store.clearPrefix('quest_'); store.del('fact'); store.del('note'); $('#noteTxt').value = '';
  stkSig = ''; prevUnlocked = null; render(); say(t('parResetDone'));
});
function updateSimBadge(){
  const b = $('#simBadge'), sim = Math.abs(offset) > 90000;
  b.hidden = !sim; if (sim) b.textContent = t('parSim', { d: toInput(now()).replace('T', ' ') });
}
$('#simBadge').addEventListener('click', openParent);
$('#simBadge').style.cursor = 'pointer';
// long press (2s) on the logo
(function(){
  const logo = $('#logo'); let timer = null;
  logo.innerHTML = sintFace();
  const start = e => { clearTimeout(timer); timer = setTimeout(() => { timer = null; openParent(); }, 2000); };
  const stop = () => { if (timer){ clearTimeout(timer); timer = null; } };
  logo.addEventListener('pointerdown', start);
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => logo.addEventListener(ev, stop));
  logo.addEventListener('contextmenu', e => e.preventDefault());
  logo.addEventListener('click', () => { if (!openSheetEl) { sfx.bell(); } });
})();

/* =====================================================================
   wire-up
   ===================================================================== */
$('#bExpand').addEventListener('click', () => toggleFull());
$('#bNight').addEventListener('click', () => setNight(!nightOn));
$('#bSound').addEventListener('click', () => { soundOn = !soundOn; store.set('sound', soundOn); setSoundUI(); if (soundOn) { unlock(); setTimeout(sfx.bell, 50); } });
$('#bLocate').addEventListener('click', locate);
$('#bFit').addEventListener('click', () => fitAll(true));
$('#refresh').addEventListener('click', () => { const b = $('#refresh'); b.classList.remove('spin'); void b.offsetWidth; b.classList.add('spin'); render(); sfx.pop(); });
$('#heroBtn').addEventListener('click', e => { if (e.currentTarget.dataset.mode === 'party') celebrate(true); else { sfx.bell(); sfx.hoof(4); } });

// illustrations
$('#avatar').innerHTML = sintFace();
$('#gateAv').innerHTML = sintFace();
$('#toastAv').innerHTML = sintFace();
$('#thankHorse').innerHTML = horseSVG({ rider: false, gifts: false, still: true });
$('#thankPiet').innerHTML = pietSVG();
$('#thankHorse .horse').classList.add('still');

// secret-word gate
(function(){
  if (!CONFIG.gate.enabled || Q.get('parent') === '1' || store.get('gate', false)) return;
  const g = $('#gate'); g.hidden = false;
  const tryIt = () => {
    const v = $('#gateIn').value.trim().toLowerCase();
    if (CONFIG.gate.answers.map(a => a.toLowerCase()).includes(v)){ store.set('gate', true); g.hidden = true; sfx.bell(); }
    else $('#gateErr').textContent = t('gateNo');
  };
  $('#gateGo').addEventListener('click', tryIt);
  $('#gateIn').addEventListener('keydown', e => { if (e.key === 'Enter') tryIt(); });
})();

setSoundUI();
$('#bNight').textContent = nightOn ? '☀️' : '🌙'; $('#bNight').setAttribute('aria-pressed', String(nightOn));
buildPresets();
initMap();
applyLang();
render();
setInterval(render, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });
addEventListener('focus', render);
if (Q.get('parent') === '1') setTimeout(openParent, 400);

})();
</script>
</body>
